x-app: &app
  build:
    context: .
  restart: unless-stopped
  init: true

services:
  app:
    <<: *app
    profiles: [memory]
    environment:
      HTTP_ADDR: ":8080"
      STORAGE_DRIVER: memory
    ports:
      - "${MEMORY_HTTP_HOST:-127.0.0.1}:${MEMORY_HTTP_PORT:-8080}:8080"

  app-postgres:
    <<: *app
    profiles: [postgres]
    environment:
      HTTP_ADDR: ":8080"
      STORAGE_DRIVER: postgres
      DATABASE_URL: "postgres://${POSTGRES_USER:-testozon}:${POSTGRES_PASSWORD:-testozon-local-only}@postgres:5432/${POSTGRES_DB:-testozon}?sslmode=disable"
    ports:
      - "${POSTGRES_HTTP_HOST:-127.0.0.1}:${POSTGRES_HTTP_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-testozon}"
      POSTGRES_USER: "${POSTGRES_USER:-testozon}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-testozon-local-only}"
    ports:
      - "${POSTGRES_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres-data:
